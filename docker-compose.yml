services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8347:8347"
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-development}
      - PORT=8347
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/real_estayer}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-real_estayer}
      - REDIS_URL=redis://redis:6379
      # Default to the in-network scraper; override to an external host via .env.
      - RUST_SCRAPER_URL=${RUST_SCRAPER_URL:-http://rust-scraper:3001}
      - SCRAPER_API_KEY=${SCRAPER_API_KEY}
      - SESSION_SECRET=${SESSION_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8347}
      - ADMIN_BOOTSTRAP_EMAILS=${ADMIN_BOOTSTRAP_EMAILS:-}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8347/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped
    networks:
      - realestayer

  mongodb:
    image: mongo:7.0.14
    # Exposed on all interfaces so an off-box rust-scraper can write directly
    # into the same collection the Go app reads from. Fine for LAN-only dev.
    # In production this should stay on the compose network and the scraper
    # should authenticate (or write through an HTTP API).
    ports:
      - "0.0.0.0:27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - realestayer
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  redis:
    image: redis:7.4-alpine
    # ports:
    #   - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - realestayer
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Admin UI. Only starts with `--profile admin` so it isn't running by default.
  # Credentials come from .env; there are no defaults.
  mongo-express:
    image: mongo-express:1.0.2
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_EXPRESS_USER}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASSWORD}
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - realestayer
    profiles:
      - admin

volumes:
  mongodb_data:
  redis_data:

networks:
  realestayer:
    driver: bridge
