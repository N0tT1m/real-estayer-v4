services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8347:8347"
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-development}
      - PORT=8347
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/real_estayer}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-real_estayer}
      - REDIS_URL=redis://redis:6379
      # The scraper normally runs OFF this box (Windows host, real Chrome), so
      # .env sets this to that host. The in-network default only applies when
      # the optional `scraper` profile is up — see that service below.
      - RUST_SCRAPER_URL=${RUST_SCRAPER_URL:-http://rust-scraper:3001}
      - SCRAPER_API_KEY=${SCRAPER_API_KEY}
      # Optional integrations. env_file already loads these; naming them here
      # keeps the set the app actually consumes visible in one place, and lets
      # a default apply where a blank value would be wrong (SMTP_PORT).
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_IMPLICIT_TLS=${SMTP_IMPLICIT_TLS:-false}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Real-Estayer}
      - SESSION_SECRET=${SESSION_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8347}
      - ADMIN_BOOTSTRAP_EMAILS=${ADMIN_BOOTSTRAP_EMAILS:-}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8347/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped
    networks:
      - realestayer

  # OPT-IN, and NOT how this is deployed. The scraper normally runs on the
  # Windows host and the app reaches it over the LAN via RUST_SCRAPER_URL —
  # it drives a real Chrome there, which is what the stealth flow depends on.
  #
  # This service exists so the stack can be brought up standalone (dev, CI, a
  # box with no Windows host). Start it explicitly:
  #
  #     docker compose --profile scraper up -d
  #     RUST_SCRAPER_URL=http://rust-scraper:3001 docker compose up -d app
  #
  # Without the profile it is never built or started, and the app keeps
  # pointing at whatever RUST_SCRAPER_URL says.
  rust-scraper:
    profiles: [scraper]
    build:
      context: ./rust-scraper
      dockerfile: Dockerfile
      target: production
    env_file:
      - .env
    environment:
      # BIND_ADDR defaults to 127.0.0.1:3001 in main.rs, which inside a
      # container binds the loopback of that container only — the app would
      # get connection-refused. It must listen on all interfaces here.
      - BIND_ADDR=0.0.0.0:3001
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/real_estayer}
      - SCRAPER_API_KEY=${SCRAPER_API_KEY}
      - ENVIRONMENT=${APP_ENV:-development}
      # The image symlinks google-chrome to chromium; be explicit so the
      # WebDriver flow doesn't fall back to a platform guess.
      - CHROME_BINARY_PATH=/usr/bin/chromium
    # Chromium crashes on the 64MB default /dev/shm under any real page load.
    shm_size: 1gb
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      # /health is deliberately exempt from the X-API-Key middleware.
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - realestayer

  mongodb:
    image: mongo:7.0.14
    # Bind address is explicit because the safe default and the useful default
    # differ. Loopback keeps an unauthenticated Mongo off the network, which is
    # what a fresh install should get. Deployments where the rust-scraper runs
    # off-box and writes directly into the same collection need it reachable,
    # and set MONGO_BIND_IP=0.0.0.0 to say so deliberately.
    #
    # Either way this database has no credentials, so exposing it is a decision
    # to make once and write down — not a default to inherit by accident.
    ports:
      - "${MONGO_BIND_IP:-127.0.0.1}:27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - realestayer
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  redis:
    image: redis:7.4-alpine
    # ports:
    #   - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - realestayer
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Admin UI. Only starts with `--profile admin` so it isn't running by default.
  # Credentials come from .env; there are no defaults.
  mongo-express:
    image: mongo-express:1.0.2
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_EXPRESS_USER}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASSWORD}
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - realestayer
    profiles:
      - admin

volumes:
  mongodb_data:
  redis_data:

networks:
  realestayer:
    driver: bridge
