name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel older runs on the same PR so pushing rapidly doesn't stack queues.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go build + test
    runs-on: ubuntu-latest

    # Integration tests (migrations, repository queries, database connect)
    # need a real MongoDB — those code paths cannot be meaningfully faked.
    # Without MONGODB_TEST_URI they skip, so this service is what makes them
    # actually run in CI rather than only on a developer machine.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Download modules
        run: go mod download

      # Formatting is a hard gate: the tree is gofmt-clean, so any drift is a
      # new regression rather than pre-existing debt. Unlike the linters below
      # there is no backlog to ratchet through.
      - name: Format check
        run: |
          unformatted=$(gofmt -l . | grep -v '^rust-scraper/' || true)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted. Run: gofmt -w ."
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test with race detector
        # -race catches concurrent map/channel misuse we wouldn't see
        # locally; it's cheap in CI and well worth it.
        run: go test -race -count=1 ./...

      # The backlog is cleared (0 issues), so this is now a hard gate. gosec and
      # govulncheck below stay advisory: gosec's remaining findings need
      # case-by-case triage (e.g. crypto/sha1 is correct for TOTP), and
      # govulncheck depends on an upstream DB that can fail the build for
      # reasons unrelated to the change under review.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

      # Now clean (0 findings): every prior finding was either fixed or
      # annotated with a #nosec carrying its justification, so anything new
      # here is a genuine regression rather than pre-existing noise.
      - name: Security scan (gosec)
        uses: securego/gosec@master
        with:
          args: -exclude-dir=rust-scraper -exclude-dir=web ./...

      - name: Vulnerability check (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        continue-on-error: true

  rust:
    name: Rust build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-scraper
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-scraper

      # The Go job has gated gofmt from the start; Rust formatting was not
      # gated, and 18 files silently drifted before anyone noticed. Same rule
      # both sides now. Runs before the build so a formatting failure is
      # reported in seconds rather than after a full compile.
      - name: Rustfmt
        run: cargo fmt --check

      # Now clean (0 warnings, including test targets): every prior warning was
      # either fixed or carries an #[allow] with its justification, so anything
      # new here is a regression. -D warnings makes that a failure.
      - name: Clippy
        run: cargo clippy --no-deps --all-targets -- -D warnings

      - name: Build binary
        run: cargo build --bin rust-scraper

      # `--test integration_tests` alone skips the unit tests compiled into the
      # library — which is where the HTML/JSON extractor and amenity coverage
      # lives. Run the whole suite.
      - name: Unit tests
        run: cargo test --lib

      - name: Integration tests
        run: cargo test --test integration_tests

  # The app is deployed on Windows, so build and unit-test there too. The Linux
  # job above stays the primary one (it has the Mongo service and the linters);
  # this exists to catch path-separator, line-ending and platform-specific
  # breakage before it reaches the machine that actually runs the thing.
  windows:
    name: Go build + test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        run: go build ./...

      # No MONGODB_TEST_URI here, so the integration tests skip by design and
      # this job covers the pure/unit suites only.
      - name: Test
        run: go test ./...

  templates:
    name: Template parse check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      # Spot-check that every HTML template parses. Catches missing `{{end}}`
      # and such without spinning up Mongo.
      - name: Parse templates
        run: |
          cat > /tmp/check_templates.go <<'EOF'
          package main
          import (
              "fmt"; "html/template"; "os"; "path/filepath"; "strings"
          )
          func main() {
              layouts, _ := filepath.Glob("web/templates/layouts/*.html")
              partials, _ := filepath.Glob("web/templates/partials/*.html")
              pages, _ := filepath.Glob("web/templates/pages/*.html")
              fails := 0
              for _, p := range pages {
                  files := append([]string{}, layouts...)
                  files = append(files, partials...)
                  files = append(files, p)
                  funcs := template.FuncMap{
                      "json": func(v any) template.JS { return "" },
                      "jsonld": func(v any) template.JS { return "" },
                      "hasPrefix": strings.HasPrefix,
                      "contains": func([]int, int) bool { return false },
                      "add": func(a, b int) int { return a + b },
                      "subtract": func(a, b int) int { return a - b },
                      "slice": func(a, b int) []int { return nil },
                      "pages": func(int, int) []int { return nil },
                      "dict": func(values ...any) (map[string]any, error) { return map[string]any{}, nil },
                  }
                  _, err := template.New(filepath.Base(p)).Funcs(funcs).ParseFiles(files...)
                  if err != nil {
                      fmt.Println(p, err)
                      fails++
                  }
              }
              if fails > 0 { os.Exit(1) }
          }
          EOF
          go run /tmp/check_templates.go
