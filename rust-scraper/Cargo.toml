[package]
name = "rust-scraper"
version = "0.1.0"
edition = "2021"

[dependencies]
log = "0.4.22"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
tracing = "0.1.40"
tracing-appender = "0.2.3"
tracing-log = "0.2"
tokio = { version = "1.41.1", features = ["full", "rt-multi-thread", "signal"] }
axum = { version = "0.8.0-alpha.1", features = ["macros"] }
tower-http = { version = "0.6.1", features = ["trace", "cors"] }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
tokio-stream = "0.1"
serde = { version = "1.0.215", features = ["derive"] }
anyhow = "1.0.93"
serde_json = "1.0.133"
thirtyfour = "0.36.1"  # Selenium WebDriver client for Rust (backup)
chromiumoxide = { version = "0.9", default-features = false }  # CDP-based browser control - more stealth
url = "2.5.3"
urlencoding = "2.1.3"
futures = "0.3.31"
selenium-rs = "0.1.2"
mongodb = "3.6"
# Feature list is load-bearing for the scraper's fingerprint, not just ergonomics:
#   http2   - Chrome always negotiates h2 with a major site. Without this the
#             fast path spoke HTTP/1.1 only while sending a Chrome UA, which
#             shows up in the ALPN we advertise and to the server directly.
#   cookies - Chrome keeps a cookie jar; without one every request looks like a
#             first visit from a browser that should have session state.
#   gzip/brotli/deflate/zstd - lets us send a real Accept-Encoding. Previously
#             forced to `identity`, which no browser ever sends.
# See scraping::profile for the wider "claims must not contradict" rationale.
reqwest = { version = "0.12.7", default-features = false, features = ["json", "rustls-tls", "http2", "cookies", "gzip", "brotli", "deflate", "zstd"] }
scraper = "0.26.0"
regex = "1.11.1"
fastrand = "2.2.0"
thiserror = "1.0.63"
dotenv = "0.15.0"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.19.0"
base64 = "0.22.0"
mail-send = "0.6.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17"

[dev-dependencies]
tokio-test = "0.4.4"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[lib]
name = "rust_scraper"
path = "src/lib.rs"
