{{template "base.html" .}}

{{define "content"}}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8" x-data="hotelSearch()">
    <h1 class="text-3xl font-bold text-gray-900 mb-8">Find Hotels</h1>

    <!-- Search Form -->
    <div class="bg-white rounded-xl shadow-sm p-6 mb-8">
        <form @submit.prevent="searchHotels" class="space-y-4">
            <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="lg:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Destination</label>
                    <input type="text" x-model="search.destination" placeholder="City or airport code (e.g., NYC, LAX)" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Check-in</label>
                    <input type="date" x-model="search.checkIn" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Check-out</label>
                    <input type="date" x-model="search.checkOut" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" required>
                </div>
            </div>

            <div class="grid md:grid-cols-5 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Rooms</label>
                    <input type="number" x-model="search.rooms" min="1" max="9" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Adults</label>
                    <input type="number" x-model="search.adults" min="1" max="9" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Star Rating</label>
                    <select x-model="search.stars" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                        <option value="">Any</option>
                        <option value="5">5 Stars</option>
                        <option value="4">4+ Stars</option>
                        <option value="3">3+ Stars</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Max Price</label>
                    <input type="number" x-model="search.maxPrice" placeholder="Per night" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                </div>
                <div class="flex items-end">
                    <button type="submit" class="w-full bg-primary-600 text-white py-3 px-6 rounded-lg font-medium hover:bg-primary-700 transition disabled:opacity-50" :disabled="loading">
                        <span x-show="!loading">Search Hotels</span>
                        <span x-show="loading" x-cloak>Searching...</span>
                    </button>
                </div>
            </div>
        </form>
    </div>

    <!-- Results -->
    <div x-show="hotels.length > 0" x-cloak>
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-semibold text-gray-900" x-text="`${hotels.length} hotels found`"></h2>
            <select x-model="sortBy" @change="sortHotels" class="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                <option value="price_asc">Price: Low to High</option>
                <option value="price_desc">Price: High to Low</option>
                <option value="rating">Guest Rating</option>
                <option value="stars">Star Rating</option>
            </select>
        </div>

        <div class="space-y-4">
            <template x-for="hotel in hotels" :key="hotel.id">
                <div class="bg-white rounded-xl shadow-sm overflow-hidden hover:shadow-lg transition">
                    <div class="md:flex">
                        <div class="md:w-1/3 aspect-[4/3] md:aspect-auto">
                            <img :src="hotel.image_url || 'https://via.placeholder.com/400x300?text=Hotel'" :alt="hotel.name" class="w-full h-full object-cover">
                        </div>
                        <div class="md:w-2/3 p-6">
                            <div class="flex justify-between items-start">
                                <div class="flex-1">
                                    <div class="flex items-center gap-2 mb-1">
                                        <template x-for="i in hotel.stars" :key="i">
                                            <svg class="h-4 w-4 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
                                                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                                            </svg>
                                        </template>
                                    </div>
                                    <h3 class="text-xl font-semibold text-gray-900" x-text="hotel.name"></h3>
                                    <p class="text-sm text-gray-500 mt-1" x-text="hotel.address"></p>

                                    <div x-show="hotel.rating" class="flex items-center mt-2">
                                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">
                                            <svg class="h-3 w-3 mr-1" fill="currentColor" viewBox="0 0 20 20">
                                                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                                            </svg>
                                            <span x-text="hotel.rating"></span>
                                        </span>
                                        <span class="ml-2 text-sm text-gray-500" x-text="hotel.review_count + ' reviews'"></span>
                                    </div>

                                    <div class="flex flex-wrap gap-2 mt-3">
                                        <template x-for="amenity in (hotel.amenities || []).slice(0, 5)" :key="amenity">
                                            <span class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded" x-text="amenity"></span>
                                        </template>
                                    </div>
                                </div>

                                <div class="text-right ml-4">
                                    <p class="text-2xl font-bold text-primary-600">$<span x-text="hotel.price.total.toFixed(2)"></span></p>
                                    <p class="text-sm text-gray-500" x-text="'per night'"></p>
                                    <p class="text-xs text-gray-400 mt-1" x-text="'$' + (hotel.price.total * getNights()).toFixed(2) + ' total'"></p>
                                    <button @click="selectHotel(hotel)" class="mt-4 bg-primary-600 text-white py-2 px-6 rounded-lg font-medium hover:bg-primary-700 transition">
                                        View Rooms
                                    </button>
                                </div>
                            </div>

                            <!-- Room options preview -->
                            <div x-show="hotel.rooms && hotel.rooms.length > 0" class="mt-4 pt-4 border-t">
                                <p class="text-sm font-medium text-gray-700 mb-2">Room options starting from:</p>
                                <div class="flex flex-wrap gap-2">
                                    <template x-for="room in (hotel.rooms || []).slice(0, 3)" :key="room.id">
                                        <span class="text-xs bg-primary-50 text-primary-700 px-3 py-1 rounded-full" x-text="room.name + ' - $' + room.price.toFixed(0)"></span>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- Empty state -->
    <div x-show="searched && hotels.length === 0" x-cloak class="text-center py-12">
        <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
        </svg>
        <h3 class="mt-2 text-sm font-medium text-gray-900">No hotels found</h3>
        <p class="mt-1 text-sm text-gray-500">Try adjusting your search criteria or dates.</p>
    </div>

    <!-- Initial state -->
    <div x-show="!searched && hotels.length === 0" class="text-center py-12">
        <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <h3 class="mt-2 text-sm font-medium text-gray-900">Search for hotels</h3>
        <p class="mt-1 text-sm text-gray-500">Enter your destination and dates to find available hotels.</p>
    </div>
</div>

<script>
function hotelSearch() {
    return {
        search: {
            destination: '',
            checkIn: '',
            checkOut: '',
            rooms: 1,
            adults: 2,
            stars: '',
            maxPrice: ''
        },
        hotels: [],
        loading: false,
        searched: false,
        sortBy: 'price_asc',

        async searchHotels() {
            this.loading = true;
            this.searched = true;

            const params = new URLSearchParams({
                city_code: this.search.destination.toUpperCase(),
                check_in: this.search.checkIn,
                check_out: this.search.checkOut,
                adults: this.search.adults,
                rooms: this.search.rooms
            });

            if (this.search.stars) {
                params.append('min_stars', this.search.stars);
            }
            if (this.search.maxPrice) {
                params.append('max_price', this.search.maxPrice);
            }

            try {
                const response = await fetch(`/api/v1/hotels/search?${params}`);
                const data = await response.json();
                this.hotels = data.hotels || [];
                this.sortHotels();
            } catch (error) {
                console.error('Search failed:', error);
                this.hotels = [];
            } finally {
                this.loading = false;
            }
        },

        sortHotels() {
            if (this.sortBy === 'price_asc') {
                this.hotels.sort((a, b) => a.price.total - b.price.total);
            } else if (this.sortBy === 'price_desc') {
                this.hotels.sort((a, b) => b.price.total - a.price.total);
            } else if (this.sortBy === 'rating') {
                this.hotels.sort((a, b) => (b.rating || 0) - (a.rating || 0));
            } else if (this.sortBy === 'stars') {
                this.hotels.sort((a, b) => b.stars - a.stars);
            }
        },

        getNights() {
            if (!this.search.checkIn || !this.search.checkOut) return 1;
            const checkIn = new Date(this.search.checkIn);
            const checkOut = new Date(this.search.checkOut);
            return Math.ceil((checkOut - checkIn) / (1000 * 60 * 60 * 24)) || 1;
        },

        selectHotel(hotel) {
            sessionStorage.setItem('selectedHotel', JSON.stringify(hotel));
            sessionStorage.setItem('hotelSearchParams', JSON.stringify(this.search));
            window.location.href = '/hotels/book';
        }
    }
}
</script>
{{end}}
