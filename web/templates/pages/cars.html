{{template "base.html" .}}

{{define "content"}}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8" x-data="carSearch()">
    <h1 class="text-3xl font-bold text-gray-900 mb-8">Rent a Car</h1>

    <!-- Search Form -->
    <div class="bg-white rounded-xl shadow-sm p-6 mb-8">
        <form @submit.prevent="searchCars" class="space-y-4">
            <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Pickup Location</label>
                    <input type="text" x-model="search.pickupLocation" placeholder="Airport code (e.g., LAX)" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Dropoff Location</label>
                    <input type="text" x-model="search.dropoffLocation" placeholder="Same as pickup if empty" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Pickup Date & Time</label>
                    <input type="datetime-local" x-model="search.pickupDateTime" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Dropoff Date & Time</label>
                    <input type="datetime-local" x-model="search.dropoffDateTime" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" required>
                </div>
            </div>

            <div class="grid md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Car Category</label>
                    <select x-model="search.category" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                        <option value="">Any Category</option>
                        <option value="ECONOMY">Economy</option>
                        <option value="COMPACT">Compact</option>
                        <option value="MIDSIZE">Midsize</option>
                        <option value="FULLSIZE">Fullsize</option>
                        <option value="SUV">SUV</option>
                        <option value="LUXURY">Luxury</option>
                        <option value="VAN">Van</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Transmission</label>
                    <select x-model="search.transmission" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                        <option value="">Any</option>
                        <option value="AUTOMATIC">Automatic</option>
                        <option value="MANUAL">Manual</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Driver Age</label>
                    <input type="number" x-model="search.driverAge" placeholder="25" min="18" max="99" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                </div>
                <div class="flex items-end">
                    <button type="submit" class="w-full bg-primary-600 text-white py-3 px-6 rounded-lg font-medium hover:bg-primary-700 transition disabled:opacity-50" :disabled="loading">
                        <span x-show="!loading">Search Cars</span>
                        <span x-show="loading" x-cloak>Searching...</span>
                    </button>
                </div>
            </div>
        </form>
    </div>

    <!-- Results -->
    <div x-show="cars.length > 0" x-cloak>
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-semibold text-gray-900" x-text="`${cars.length} cars found`"></h2>
            <select x-model="sortBy" @change="sortCars" class="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                <option value="price_asc">Price: Low to High</option>
                <option value="price_desc">Price: High to Low</option>
                <option value="category">Category</option>
            </select>
        </div>

        <div class="grid lg:grid-cols-2 gap-6">
            <template x-for="car in cars" :key="car.id">
                <div class="bg-white rounded-xl shadow-sm overflow-hidden hover:shadow-lg transition">
                    <div class="md:flex">
                        <div class="md:w-1/3 bg-gray-100 p-4 flex items-center justify-center">
                            <img :src="car.vehicle.image_url || 'https://via.placeholder.com/200x120?text=Car'" :alt="car.vehicle.type" class="max-w-full h-auto">
                        </div>
                        <div class="md:w-2/3 p-4">
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <span class="inline-block px-2 py-1 bg-primary-100 text-primary-700 text-xs font-medium rounded mb-2" x-text="car.vehicle.category"></span>
                                    <h3 class="font-semibold text-gray-900" x-text="car.vehicle.type"></h3>
                                    <p class="text-sm text-gray-500" x-text="car.vendor"></p>
                                </div>
                                <div class="text-right">
                                    <p class="text-2xl font-bold text-primary-600">$<span x-text="car.price.total.toFixed(2)"></span></p>
                                    <p class="text-sm text-gray-500">total</p>
                                </div>
                            </div>

                            <div class="flex flex-wrap gap-2 text-sm text-gray-600 mb-4">
                                <span class="flex items-center">
                                    <svg class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                                    </svg>
                                    <span x-text="car.vehicle.seats + ' seats'"></span>
                                </span>
                                <span class="flex items-center">
                                    <svg class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                                    </svg>
                                    <span x-text="car.vehicle.bags + ' bags'"></span>
                                </span>
                                <span class="flex items-center">
                                    <svg class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    </svg>
                                    <span x-text="car.vehicle.transmission"></span>
                                </span>
                                <span x-show="car.vehicle.air_con" class="flex items-center">
                                    <svg class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                                    </svg>
                                    A/C
                                </span>
                            </div>

                            <div class="flex flex-wrap gap-2 text-xs text-gray-500 mb-4">
                                <span class="bg-green-100 text-green-700 px-2 py-1 rounded" x-text="car.policies.mileage"></span>
                                <span x-show="car.policies.insurance_included" class="bg-blue-100 text-blue-700 px-2 py-1 rounded">Insurance Included</span>
                            </div>

                            <button @click="selectCar(car)" class="w-full bg-primary-600 text-white py-2 px-4 rounded-lg font-medium hover:bg-primary-700 transition">
                                Select
                            </button>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- Empty state -->
    <div x-show="searched && cars.length === 0" x-cloak class="text-center py-12">
        <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
        </svg>
        <h3 class="mt-2 text-sm font-medium text-gray-900">No cars found</h3>
        <p class="mt-1 text-sm text-gray-500">Try adjusting your search criteria.</p>
    </div>

    <!-- Initial state -->
    <div x-show="!searched && cars.length === 0" class="text-center py-12">
        <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <h3 class="mt-2 text-sm font-medium text-gray-900">Search for rental cars</h3>
        <p class="mt-1 text-sm text-gray-500">Enter your pickup location and dates to find available cars.</p>
    </div>
</div>

<script>
function carSearch() {
    return {
        search: {
            pickupLocation: '',
            dropoffLocation: '',
            pickupDateTime: '',
            dropoffDateTime: '',
            category: '',
            transmission: '',
            driverAge: 25
        },
        cars: [],
        loading: false,
        searched: false,
        sortBy: 'price_asc',

        async searchCars() {
            this.loading = true;
            this.searched = true;

            const params = new URLSearchParams({
                pickup_location: this.search.pickupLocation,
                dropoff_location: this.search.dropoffLocation || this.search.pickupLocation,
                pickup_datetime: this.search.pickupDateTime,
                dropoff_datetime: this.search.dropoffDateTime,
                driver_age: this.search.driverAge,
                category: this.search.category,
                transmission: this.search.transmission
            });

            try {
                const response = await fetch(`/api/v1/cars/search?${params}`);
                const data = await response.json();
                this.cars = data.cars || [];
                this.sortCars();
            } catch (error) {
                console.error('Search failed:', error);
                this.cars = [];
            } finally {
                this.loading = false;
            }
        },

        sortCars() {
            if (this.sortBy === 'price_asc') {
                this.cars.sort((a, b) => a.price.total - b.price.total);
            } else if (this.sortBy === 'price_desc') {
                this.cars.sort((a, b) => b.price.total - a.price.total);
            } else if (this.sortBy === 'category') {
                this.cars.sort((a, b) => a.vehicle.category.localeCompare(b.vehicle.category));
            }
        },

        selectCar(car) {
            // Store selected car and redirect to booking
            sessionStorage.setItem('selectedCar', JSON.stringify(car));
            sessionStorage.setItem('carSearchParams', JSON.stringify(this.search));
            // In a real app, redirect to booking page
            alert('Car selected: ' + car.vehicle.type + ' from ' + car.vendor + '\n\nTotal: $' + car.price.total.toFixed(2));
        }
    }
}
</script>
{{end}}
